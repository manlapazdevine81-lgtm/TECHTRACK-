; Phase 11 — pytest configuration.
;
; Tests run ONLY against the isolated PostgreSQL `techis_test` database:
;   * `tests/conftest.py` rewrites DATABASE_URL to `/techis_test` and every
;     `client` fixture does drop_all()/create_all() in that database, so the
;     development database (`techis_dev`) is never touched by a test run.
;   * `testpaths` keeps collection inside tests/. The one-off root scripts
;     (`test_auth.py`, `_simple_feedback_test.py`, `verify.py`, …) are manual
;     debugging helpers, not a test suite — running them from `python -m pytest`
;     at the project root leaked into the dev database, so they are excluded.
[pytest]
testpaths = tests
python_files = test_*.py
; No `--strict-markers` yet: existing modules do not register custom markers.
addopts = -ra
