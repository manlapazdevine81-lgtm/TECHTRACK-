{% extends "base.html" %}
{% block title %}Log in — TechIS{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Log in</h1>
  <p class="muted">Tech Innovators Society (TechIS) — BatStateU TNEU Lipa Campus</p>
  <form method="post" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required value="{{ request.form.email or '' }}">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{{ url_for('auth.register') }}">Register here</a>.</p>
</div>
{% endblock %}
